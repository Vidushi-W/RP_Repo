name: slsl_connect
description: SLSL Connect Android client — accessible motion to speech.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.10.8
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  flutter_secure_storage: ^10.0.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  # Android implementation without an unnecessary JNI/CMake build dependency.
  path_provider_android: 2.2.22
  file_picker: ^10.3.10
  audioplayers: ^6.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

